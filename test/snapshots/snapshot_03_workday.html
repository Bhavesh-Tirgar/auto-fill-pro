<!DOCTYPE html>
<html>
<head><title>Workday Enterprise Career Application</title></head>
<body>
  <div data-automation-id="workdayApplication">
    <h2>Candidate Profile Information</h2>
    <div><label data-automation-id="formLabel">Legal First Name</label><input type="text" data-automation-id="legalFirstName" id="wd_fname" name="legal_first_name"></div>
    <div><label data-automation-id="formLabel">Legal Last Name</label><input type="text" data-automation-id="legalLastName" id="wd_lname" name="legal_last_name"></div>
    <div><label data-automation-id="formLabel">Primary Email Address</label><input type="email" data-automation-id="email" id="wd_email" name="primary_email"></div>
    <div><label data-automation-id="formLabel">Phone Number</label><input type="tel" data-automation-id="phone" id="wd_phone" name="phone"></div>
    <div><label data-automation-id="formLabel">Street Address Line 1</label><input type="text" data-automation-id="addressSection_addressLine1" id="wd_addr1" name="address_line_1"></div>
    <div><label data-automation-id="formLabel">City</label><input type="text" data-automation-id="addressSection_city" id="wd_city" name="city"></div>
    <div><label data-automation-id="formLabel">Postal Code / PIN</label><input type="text" data-automation-id="addressSection_postalCode" id="wd_postal" name="postal_code"></div>
    <div><label data-automation-id="formLabel">Country</label><input type="text" data-automation-id="addressSection_country" id="wd_country" name="country"></div>
  </div>
</body>
</html>
