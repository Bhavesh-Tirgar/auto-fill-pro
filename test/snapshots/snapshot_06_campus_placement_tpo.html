<!DOCTYPE html>
<html>
<head><title>Campus Placement Cell TPO Registration</title></head>
<body>
  <div class="tpo-form">
    <h2>Campus Recruitment Drive Form</h2>
    <div class="form-item"><label>Student Full Name</label><input type="text" name="student_name"></div>
    <div class="form-item"><label>College Email ID</label><input type="email" name="college_email"></div>
    <div class="form-item"><label>Contact Mobile Number</label><input type="tel" name="phone"></div>
    <div class="form-item"><label>College / Institute Name</label><input type="text" name="college_name"></div>
    <div class="form-item"><label>Degree / Qualification</label><input type="text" name="degree"></div>
    <div class="form-item"><label>Branch / Discipline</label><input type="text" name="branch"></div>
    <div class="form-item"><label>University Roll Number / PRN</label><input type="text" name="prn_number"></div>
    <div class="form-item"><label>Current CGPA / Aggregate</label><input type="text" name="cgpa"></div>
    <div class="form-item"><label>Passing Year / Graduation Year</label><input type="number" name="passing_year"></div>
    <div class="form-item"><label>Core Technical Skills</label><input type="text" name="technical_skills"></div>
    <div class="form-item"><label>GitHub URL</label><input type="text" name="github_url"></div>
  </div>
</body>
</html>
