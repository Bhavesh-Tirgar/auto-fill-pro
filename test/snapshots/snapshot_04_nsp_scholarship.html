<!DOCTYPE html>
<html>
<head><title>National Scholarship Portal (NSP)</title></head>
<body>
  <div class="nsp-container">
    <h2>Student Registration Form</h2>
    <div class="field"><label>State of Domicile</label><input type="text" name="domicile_state" id="nsp_domicile"></div>
    <div class="field"><label>Name of Student</label><input type="text" name="student_name" id="nsp_name"></div>
    <div class="field"><label>Date of Birth</label><input type="date" name="dob" id="nsp_dob"></div>
    <div class="field"><label>Gender</label><select name="gender" id="nsp_gender"><option value="Male">Male</option><option value="Female">Female</option></select></div>
    <div class="field"><label>Mobile Number</label><input type="tel" name="mobile_number" id="nsp_mobile"></div>
    <div class="field"><label>Email Id</label><input type="email" name="email_id" id="nsp_email"></div>
    <div class="field"><label>Community / Caste Category</label><select name="category" id="nsp_category"><option value="General">General</option><option value="OBC">OBC</option><option value="SC">SC</option><option value="ST">ST</option></select></div>
    <div class="field"><label>Father's Name</label><input type="text" name="father_name" id="nsp_father"></div>
    <div class="field"><label>Mother's Name</label><input type="text" name="mother_name" id="nsp_mother"></div>
    <div class="field"><label>Annual Family Income</label><input type="number" name="annual_income" id="nsp_income"></div>
  </div>
</body>
</html>
