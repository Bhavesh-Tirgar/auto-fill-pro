<!DOCTYPE html>
<html>
<head><title>Lever Application Form</title></head>
<body>
  <div class="application-form">
    <h2>Apply for Frontend Engineer</h2>
    <div class="form-group"><label>Full Name</label><input type="text" name="name" placeholder="Full name"></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" placeholder="Email address"></div>
    <div class="form-group"><label>Phone</label><input type="tel" name="phone" placeholder="Phone number"></div>
    <div class="form-group"><label>Current company</label><input type="text" name="org" placeholder="Current company"></div>
    <div class="form-group"><label>LinkedIn URL</label><input type="text" name="urls[LinkedIn]" placeholder="/in/username"></div>
    <div class="form-group"><label>GitHub URL</label><input type="text" name="urls[GitHub]" placeholder="/username"></div>
    <div class="form-group"><label>Portfolio URL</label><input type="text" name="urls[Portfolio]" placeholder="https://"></div>
    <div class="form-group"><label>Additional Info / Summary</label><textarea name="comments" placeholder="Add a cover letter..."></textarea></div>
  </div>
</body>
</html>
