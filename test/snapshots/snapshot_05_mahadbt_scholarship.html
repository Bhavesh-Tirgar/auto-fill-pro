<!DOCTYPE html>
<html>
<head><title>MahaDBT State Scholarship Portal</title></head>
<body>
  <div class="mahadbt-card">
    <h2>Post-Matric Scholarship Applicant Details</h2>
    <div class="row"><label>Applicant Name (As per SSC marksheet)</label><input type="text" name="txtApplicantName"></div>
    <div class="row"><label>Father's Name</label><input type="text" name="txtFatherName"></div>
    <div class="row"><label>Mother's Name</label><input type="text" name="txtMotherName"></div>
    <div class="row"><label>Religion</label><input type="text" name="txtReligion"></div>
    <div class="row"><label>Caste Category</label><select name="ddlCasteCategory"><option value="General">General</option><option value="OBC">OBC</option><option value="SC">SC</option></select></div>
    <div class="row"><label>Taluka</label><input type="text" name="txtTaluka"></div>
    <div class="row"><label>District</label><input type="text" name="txtDistrict"></div>
    <div class="row"><label>Area PIN Code</label><input type="text" name="txtPinCode"></div>
    <div class="row"><label>Person with Disability (PWD)</label><select name="ddlPwd"><option value="No">No</option><option value="Yes">Yes</option></select></div>
  </div>
</body>
</html>
