<!DOCTYPE html>
<html>
<head><title>Internship Application Form</title></head>
<body>
  <div class="intern-form">
    <h2>Apply for Software Development Internship</h2>
    <div><label>First Name</label><input type="text" name="first_name"></div>
    <div><label>Last Name</label><input type="text" name="last_name"></div>
    <div><label>Email</label><input type="email" name="email"></div>
    <div><label>Contact Number</label><input type="tel" name="contact_number"></div>
    <div><label>Graduation College</label><input type="text" name="college"></div>
    <div><label>Graduation Degree</label><input type="text" name="degree"></div>
    <div><label>Graduation Passing Year</label><input type="number" name="passing_year"></div>
    <div><label>Skills</label><input type="text" name="skills"></div>
    <div><label>Portfolio URL</label><input type="text" name="portfolio"></div>
    <div><label>GitHub Profile</label><input type="text" name="github"></div>
  </div>
</body>
</html>
