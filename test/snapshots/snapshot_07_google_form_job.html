<!DOCTYPE html>
<html>
<head><title>Google Form - Job Opening</title></head>
<body>
  <div role="list">
    <div role="listitem">
      <span>Candidate Full Name</span>
      <input type="text" aria-label="Candidate Full Name">
    </div>
    <div role="listitem">
      <span>Applicant Email</span>
      <input type="email" aria-label="Applicant Email">
    </div>
    <div role="listitem">
      <span>Contact Number</span>
      <input type="tel" aria-label="Contact Number">
    </div>
    <div role="listitem">
      <span>Current Employer</span>
      <input type="text" aria-label="Current Employer">
    </div>
    <div role="listitem">
      <span>Total Experience in Years</span>
      <input type="text" aria-label="Total Experience in Years">
    </div>
    <div role="listitem">
      <span>Notice Period in Days</span>
      <input type="text" aria-label="Notice Period in Days">
    </div>
    <div role="listitem">
      <span>LinkedIn URL</span>
      <input type="text" aria-label="LinkedIn URL">
    </div>
  </div>
</body>
</html>
