<!DOCTYPE html>
<html>
<head><title>Oracle Taleo Enterprise Applicant Portal</title></head>
<body>
  <div class="taleo-page">
    <h2>Profile Information</h2>
    <div><label for="f_name">Candidate First Name</label><input type="text" id="f_name" name="taleo_first_name"></div>
    <div><label for="l_name">Candidate Last Name</label><input type="text" id="l_name" name="taleo_last_name"></div>
    <div><label for="u_email">Email Address</label><input type="email" id="u_email" name="taleo_email"></div>
    <div><label for="u_phone">Primary Phone</label><input type="tel" id="u_phone" name="taleo_primary_phone"></div>
    <div><label for="u_addr">Address Line 1</label><input type="text" id="u_addr" name="taleo_address"></div>
    <div><label for="u_city">City</label><input type="text" id="u_city" name="taleo_city"></div>
    <div><label for="u_state">State</label><input type="text" id="u_state" name="taleo_state"></div>
    <div><label for="u_zip">Postal Code</label><input type="text" id="u_zip" name="taleo_zipcode"></div>
    <div><label for="u_exp">Total Experience (Years)</label><input type="number" id="u_exp" name="taleo_total_experience"></div>
    <div><label for="u_role">Current Job Title</label><input type="text" id="u_role" name="taleo_current_title"></div>
  </div>
</body>
</html>
