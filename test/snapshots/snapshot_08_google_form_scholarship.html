<!DOCTYPE html>
<html>
<head><title>Google Form - Student Financial Aid</title></head>
<body>
  <div role="list">
    <div role="listitem"><span>Name of Applicant</span><input type="text" aria-label="Name of Applicant"></div>
    <div role="listitem"><span>Email ID</span><input type="email" aria-label="Email ID"></div>
    <div role="listitem"><span>Mobile No</span><input type="tel" aria-label="Mobile No"></div>
    <div role="listitem"><span>Father Name</span><input type="text" aria-label="Father Name"></div>
    <div role="listitem"><span>Mother Name</span><input type="text" aria-label="Mother Name"></div>
    <div role="listitem"><span>Annual Family Income</span><input type="text" aria-label="Annual Family Income"></div>
    <div role="listitem"><span>City</span><input type="text" aria-label="City"></div>
    <div role="listitem"><span>PIN Code</span><input type="text" aria-label="PIN Code"></div>
  </div>
</body>
</html>
