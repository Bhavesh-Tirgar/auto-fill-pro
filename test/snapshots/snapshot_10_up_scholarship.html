<!DOCTYPE html>
<html>
<head><title>UP State Scholarship Online Portal</title></head>
<body>
  <div class="up-gov-form">
    <h2>Postmatric Scholarship & Fee Reimbursement Scheme</h2>
    <div class="field"><label>छात्र / छात्रा का नाम (Student Name)</label><input type="text" name="txtStudentName"></div>
    <div class="field"><label>पिता का नाम (Father Name)</label><input type="text" name="txtFatherName"></div>
    <div class="field"><label>माता का नाम (Mother Name)</label><input type="text" name="txtMotherName"></div>
    <div class="field"><label>जन्म तिथि (Date of Birth)</label><input type="date" name="txtDob"></div>
    <div class="field"><label>जाति वर्ग (Caste Category)</label><select name="ddlCategory"><option value="General">General</option><option value="OBC">OBC</option><option value="SC">SC</option></select></div>
    <div class="field"><label>जनपद (District)</label><input type="text" name="txtDistrict"></div>
    <div class="field"><label>तहसील / Taluka</label><input type="text" name="txtTehsil"></div>
    <div class="field"><label>पिन कोड (PIN Code)</label><input type="text" name="txtPincode"></div>
    <div class="field"><label>मोबाइल नंबर (Mobile No)</label><input type="tel" name="txtMobile"></div>
    <div class="field"><label>ईमेल (Email ID)</label><input type="email" name="txtEmail"></div>
  </div>
</body>
</html>
