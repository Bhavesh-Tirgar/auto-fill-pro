<!DOCTYPE html>
<html>
<head><title>SmartRecruiters Job Application</title></head>
<body>
  <div class="sr-application">
    <h2>Apply for Lead Engineer</h2>
    <div><label for="sr_name">Full Name</label><input type="text" id="sr_name" name="name"></div>
    <div><label for="sr_email">Email</label><input type="email" id="sr_email" name="email"></div>
    <div><label for="sr_phone">Phone Number</label><input type="tel" id="sr_phone" name="phoneNumber"></div>
    <div><label for="sr_loc">Current City</label><input type="text" id="sr_loc" name="location"></div>
    <div><label for="sr_company">Current Company</label><input type="text" id="sr_company" name="experience[0].company"></div>
    <div><label for="sr_title">Current Title</label><input type="text" id="sr_title" name="experience[0].title"></div>
    <div><label for="sr_linkedin">LinkedIn Profile URL</label><input type="text" id="sr_linkedin" name="webProfiles.linkedin"></div>
    <div><label for="sr_github">GitHub Profile URL</label><input type="text" id="sr_github" name="webProfiles.github"></div>
    <div><label for="sr_portfolio">Personal Website</label><input type="text" id="sr_portfolio" name="webProfiles.website"></div>
    <div><label for="sr_bio">Summary</label><textarea id="sr_bio" name="summary"></textarea></div>
  </div>
</body>
</html>
