<!DOCTYPE html>
<html>
<head><title>Greenhouse ATS Application</title></head>
<body>
  <div id="application_form">
    <h2>Apply for Software Engineer - Backend</h2>
    <div class="field"><label for="first_name">First Name *</label><input type="text" id="first_name" name="job_application[first_name]"></div>
    <div class="field"><label for="last_name">Last Name *</label><input type="text" id="last_name" name="job_application[last_name]"></div>
    <div class="field"><label for="email">Email *</label><input type="email" id="email" name="job_application[email]"></div>
    <div class="field"><label for="phone">Phone *</label><input type="tel" id="phone" name="job_application[phone]"></div>
    <div class="field"><label for="job_application_location">Location (City)</label><input type="text" id="job_application_location" name="job_application[location]"></div>
    <div class="field"><label for="urls_LinkedIn">LinkedIn Profile</label><input type="text" id="urls_LinkedIn" name="job_application[answers_attributes][0][text_value]"></div>
    <div class="field"><label for="urls_GitHub">GitHub Profile</label><input type="text" id="urls_GitHub" name="job_application[answers_attributes][1][text_value]"></div>
    <div class="field"><label for="urls_Portfolio">Portfolio URL</label><input type="text" id="urls_Portfolio" name="job_application[answers_attributes][2][text_value]"></div>
  </div>
</body>
</html>
