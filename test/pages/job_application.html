<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Application Benchmark Form</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.5; }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 13px; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Senior Software Engineer Application</h1>
  <form id="job-form">
    <div class="field">
      <label for="cand_name">Full Name *</label>
      <input type="text" id="cand_name" name="candidate_name" placeholder="John Doe">
    </div>
    <div class="field">
      <label for="cand_email">Email Address *</label>
      <input type="email" id="cand_email" name="email" placeholder="john@example.com">
    </div>
    <div class="field">
      <label for="cand_phone">Mobile Number *</label>
      <input type="tel" id="cand_phone" name="phone_number" placeholder="10-digit mobile">
    </div>
    <div class="field">
      <label for="current_comp">Current Employer / Company</label>
      <input type="text" id="current_comp" name="current_company">
    </div>
    <div class="field">
      <label for="curr_role">Current Job Title</label>
      <input type="text" id="curr_role" name="job_title">
    </div>
    <div class="field">
      <label for="exp_years">Years of Experience</label>
      <input type="number" id="exp_years" name="total_experience">
    </div>
    <div class="field">
      <label for="notice_period">Notice Period (Days)</label>
      <input type="number" id="notice_period" name="notice_period_days">
    </div>
    <div class="field">
      <label for="curr_ctc">Current CTC (LPA / Annual)</label>
      <input type="text" id="curr_ctc" name="current_salary">
    </div>
    <div class="field">
      <label for="exp_ctc">Expected CTC (LPA / Annual)</label>
      <input type="text" id="exp_ctc" name="expected_salary">
    </div>
    <div class="field">
      <label for="skills_input">Key Skills & Technologies</label>
      <input type="text" id="skills_input" name="key_skills">
    </div>
    <div class="field">
      <label for="linkedin_url">LinkedIn Profile</label>
      <input type="text" id="linkedin_url" name="linkedin_profile">
    </div>
    <div class="field">
      <label for="github_url">GitHub Profile</label>
      <input type="text" id="github_url" name="github_profile">
    </div>
    <div class="field">
      <label for="portfolio_url">Portfolio Website</label>
      <input type="text" id="portfolio_url" name="portfolio_link">
    </div>
    <div class="field">
      <label for="summary_bio">Professional Summary / Bio</label>
      <textarea id="summary_bio" name="about_you" rows="4"></textarea>
    </div>
    <button type="submit" id="submit-btn" style="padding: 10px 20px; background: blue; color: white;">Submit Application</button>
  </form>
</body>
</html>
